name: mindmap-server
services:
  server:
    # Retained only to export pre-node documents or perform an explicit rollback.
    # The normal backend is mindmap-node on each machine, installed on the host.
    profiles: [legacy]
    image: debian:bookworm-slim
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: ["/opt/figcraft/figcraft-server"]
    command: ["--listen", "0.0.0.0:47910", "--data", "/data"]
    ports:
      - "47910:47910"
    volumes:
      - ./bin/figcraft-server:/opt/figcraft/figcraft-server:ro
      - ./data:/data
    security_opt: [no-new-privileges:true]

networks:
  default:
    ipam:
      config:
        - subnet: 10.253.94.0/24
