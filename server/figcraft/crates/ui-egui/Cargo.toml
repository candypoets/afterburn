[package]
name = "figcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
afterburn-build = { workspace = true }
sha2 = { workspace = true }
figcraft-geom = { workspace = true }
figcraft-color = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-text = { workspace = true }
figcraft-layout = { workspace = true }
figcraft-render = { workspace = true }
figcraft-pathops = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-collab = { workspace = true }
figcraft-format = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"

[features]
# The sound of video clips on the canvas (rodio: CoreAudio on macOS; ALSA headers on Linux). The
# desktop app turns it on for macOS; without it clips play silently.
video-audio = ["dep:rodio"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
afterburn-video = { workspace = true }
rodio = { version = "0.21", optional = true, default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
wat = { workspace = true }
