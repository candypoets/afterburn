[package]
name = "mindmap-node"
version = "0.1.0"
edition = "2021"
description = "Mindmap node: live worktree designs, shared Herdr agents, Git-backed Sync"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "mindmap-node"
path = "src/node_main.rs"

[dependencies]
mindmap-build = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figcraft-doc = { workspace = true }
figcraft-collab = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }
