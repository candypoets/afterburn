[package]
name = "mindmap-service"
version = "0.1.0"
edition = "2021"
description = "Mindmap project service: Herdr workspaces, FigCraft documents, agents"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "mindmap-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
