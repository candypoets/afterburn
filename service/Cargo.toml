[package]
name = "mindmap-service"
version = "0.1.0"
edition = "2021"
description = "Mindmap node: live worktree designs, shared Herdr agents, Git-backed Sync"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "mindmap-node"
path = "src/node_main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figcraft-doc = { path = "../server/figcraft/crates/doc" }
figcraft-collab = { path = "../server/figcraft/crates/collab" }
figcraft-engine = { path = "../server/figcraft/crates/engine" }
figcraft-format = { path = "../server/figcraft/crates/format" }
figcraft-text = { path = "../server/figcraft/crates/text" }

[profile.release]
strip = true
