[package]
name = "afterburn-node"
version = "0.1.0"
edition = "2021"
description = "Afterburn node: live worktree designs, shared Herdr agents, Git-backed Sync"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "afterburn-node"
path = "src/node_main.rs"

[dependencies]
afterburn-build = { workspace = true }
afterburn-video = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figcraft-doc = { workspace = true }
figcraft-collab = { workspace = true }
figcraft-engine = { workspace = true }
figcraft-format = { workspace = true }
figcraft-text = { workspace = true }

# Herdr's control socket is a Unix domain socket on Unix and a named pipe on Windows. Windows
# builds use the same crate Herdr itself uses to derive the pipe name from the socket path.
[target.'cfg(windows)'.dependencies]
interprocess = "2.4"
