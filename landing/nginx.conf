server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location ~* \.(css|js)$ { add_header Cache-Control "public, max-age=3600"; }
    location ^~ /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ^~ /assets/ { add_header Cache-Control "public, max-age=86400"; }

    # Published files (the demo video, the builds) live on the host, mounted at /srv/files.
    # Until a build is there, /download/ shows the "on their way" page.
    location ^~ /media/ { root /srv/files; try_files $uri =404; }
    location ^~ /download/ { root /srv/files; try_files $uri $uri/index.html @soon; }
    location @soon { root /usr/share/nginx/html; try_files /soon.html =404; }

    location = /healthz { access_log off; return 200 "ok\n"; }
    error_page 404 /soon.html;
}
